name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Ephemeral Postgres for this job only — lets `prisma migrate deploy`
    # actually run against a real database in CI, not just typecheck.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: codearena
          POSTGRES_PASSWORD: codearena
          POSTGRES_DB: codearena_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codearena"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://codearena:codearena@localhost:5432/codearena_ci
      JWT_ACCESS_SECRET: ci_access_secret_placeholder_value
      JWT_REFRESH_SECRET: ci_refresh_secret_placeholder_value

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm run build
